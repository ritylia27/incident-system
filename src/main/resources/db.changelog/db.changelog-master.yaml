databaseChangeLog:
  - logicalFilePath: db/changelog/db.changelog-master.yaml
  - changeSet:
      id: 001-create-incidents-table
      author: margo
      changes:
        - createTable:
            tableName: incidents
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: date_create
                  type: DATE

              - column:
                  name: date_closed
                  type: DATE

              - column:
                  name: analyst_id
                  type: BIGINT

              - column:
                  name: initiator_id
                  type: BIGINT

              - column:
                  name: status
                  type: VARCHAR(50)

              - column:
                  name: priority
                  type: VARCHAR(50)

              - column:
                  name: category
                  type: VARCHAR(100)

              - column:
                  name: responsible_service
                  type: VARCHAR(100)
